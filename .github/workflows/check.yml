name: CP/M 3 source and runtime checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y build-essential bison python3-pexpect
      - uses: actions/checkout@v4
        with:
          repository: ddanila/Pico1715
          ref: dcfd610aa97edf097c2d8b33b4c7c0da11ea0c03
          path: build/deps/Pico1715
      - uses: actions/checkout@v4
        with:
          repository: ddanila/dac-emulation
          ref: 4180d456a64f11d95363b4b19ab09ad12165de60
          path: build/deps/dac-emulation
      - run: make -j2 all serial test
      - run: make probe PICO=build/deps/Pico1715 DAC=build/deps/dac-emulation
      - run: python3 tools/check_runtime.py --binary build/classic-probe --rom build/test.rom --backend native --suite all --out local/ci --report reports/public-runtime.json
      - run: python3 tools/check_diagnostics.py --binary build/classic-probe --rom build/test.rom --backend native --extended --out local/diagnostics
      - run: python3 tools/check_reproducible.py
      - run: python3 tools/package.py --report reports/public-runtime.json --report reports/reproducible.json
      - uses: actions/upload-artifact@v4
        with:
          name: cpm-plus-1715-simulator
          path: out/cpm-plus-1715-simulator.zip

  firmware-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y build-essential bison verilator
      - uses: actions/checkout@v4
        with:
          repository: ddanila/Pico1715
          ref: dcfd610aa97edf097c2d8b33b4c7c0da11ea0c03
          path: build/deps/Pico1715
      - uses: actions/checkout@v4
        with:
          repository: ddanila/dac-emulation
          ref: 4180d456a64f11d95363b4b19ab09ad12165de60
          path: build/deps/dac-emulation
      - run: make -j2 all test-rom
      - run: make firmware-probe PICO=build/deps/Pico1715 DAC=build/deps/dac-emulation
      - run: python3 tools/check_runtime.py --binary build/firmware/classic-probe --rom build/test.rom --backend firmware --suite smoke --out local/firmware-smoke --report local/firmware-smoke.json
      - run: python3 tools/check_diagnostics.py --binary build/firmware/classic-probe --rom build/test.rom --backend firmware --out local/firmware-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-smoke-evidence
          path: local/firmware-smoke/

  serial:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [emulator, hardware, managed, managed-failures, tools-utilities, tools-streams, tools-binary, tools-large, tools-failures, tools-upgrade]
    defaults:
      run:
        working-directory: cpm-plus-1715
    steps:
      - uses: actions/checkout@v4
        with:
          path: cpm-plus-1715
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: ddanila/Pico1715
          ref: dcfd610aa97edf097c2d8b33b4c7c0da11ea0c03
          path: Pico1715
      - uses: actions/checkout@v4
        with:
          repository: ddanila/dac-emulation
          ref: 4180d456a64f11d95363b4b19ab09ad12165de60
          path: dac-emulation
      - uses: actions/checkout@v4
        with:
          repository: ddanila/ravi
          ref: 2491ec9559abaafe00a294f33ef97b7ec0d1e645
          path: ravi
      - uses: actions/checkout@v4
        with:
          repository: ddanila/8080-cosim
          ref: c279e7e13a7936520570641e8af2900fa5ad4361
          path: 8080-cosim
      - run: sudo apt-get update && sudo apt-get install -y build-essential bison python3-pexpect
      - run: ../8080-cosim/sync/jukuhost_linux_build.sh
      - run: make serial-probe test
      - if: matrix.runner == 'emulator'
        run: python3 tools/check_serial_runtime.py --rom build/serial-test.rom --out local/serial-ci
      - if: matrix.runner == 'emulator'
        run: python3 tools/check_auto_recovery.py --host ../8080-cosim/build/jukuhost --out local/auto-stock --stock
      - if: matrix.runner == 'hardware'
        run: |
          python3 tools/check_hardware_runner.py --rom build/serial-test.rom --out local/serial-ci
          for scenario in boot-timeout disconnect interrupt; do
            python3 tools/check_hardware_runner.py --rom build/serial-test.rom --scenario "$scenario" --out "local/serial-$scenario"
          done
      - if: matrix.runner == 'managed'
        run: python3 tools/check_managed_session.py --rom build/serial-test.rom --out local/serial-managed
      - if: matrix.runner == 'tools-utilities'
        run: python3 tools/check_tools_runtime.py --rom build/serial-test.rom --suite utilities --out local/serial-tools
      - if: matrix.runner == 'tools-streams'
        run: python3 tools/check_tools_runtime.py --rom build/serial-test.rom --suite streams --out local/serial-streams
      - if: matrix.runner == 'tools-binary'
        run: python3 tools/check_tools_runtime.py --rom build/serial-test.rom --suite binary --sizes 0,1,127,128,129,16385 --out local/serial-bin
      - if: matrix.runner == 'tools-large'
        run: python3 tools/check_tools_runtime.py --rom build/serial-test.rom --suite binary --sizes 49153 --out local/serial-big
      - if: matrix.runner == 'tools-failures'
        run: |
          python3 tools/check_tools_runtime.py --rom build/serial-test.rom --failure full --out local/serial-full
          python3 tools/check_tools_runtime.py --rom build/serial-test.rom --failure readonly --out local/serial-ro
      - if: matrix.runner == 'tools-upgrade'
        run: python3 tools/check_tools_runtime.py --rom build/serial-test.rom --upgrade --out local/serial-up
      - if: matrix.runner == 'managed-failures'
        run: python3 tools/check_managed_session.py --rom build/serial-test.rom --suite failures --out local/serial-mf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-${{ matrix.runner }}-evidence
          path: cpm-plus-1715/local/serial-*/
