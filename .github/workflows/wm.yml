name: W/M serial CP/M qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bison
      - uses: actions/checkout@v4
        with:
          repository: ddanila/ravi
          ref: 451925f693852d6423af717b3b0add23672536ee
          path: build/deps/ravi
      - uses: actions/checkout@v4
        with:
          repository: ddanila/dac-emulation
          ref: e53c19710a3d1a498082fa3fc60f4cfaa63ce52c
          path: build/deps/dac-emulation
      - uses: actions/checkout@v4
        with:
          repository: ddanila/8080-cosim
          ref: c279e7e13a7936520570641e8af2900fa5ad4361
          path: build/deps/8080-cosim
      - run: cmp firmware/w4-4.1.0/rom-w4.bin build/deps/ravi/src/ravi/backends/robotron1715w/rom-w4.bin
      - run: python -m pip install pexpect -e build/deps/ravi
      - run: make wm wm-fast wm-62400 wm-9600 wm-probe DAC=build/deps/dac-emulation
      - run: python tools/check_recovery_profile.py
      - run: bash build/deps/8080-cosim/sync/jukuhost_linux_build.sh
      - run: bash build/deps/8080-cosim/sync/jukuhost_runner_check.sh && bash build/deps/8080-cosim/sync/jukuhost_core_check.sh
      - run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -D_DEFAULT_SOURCE -Ibuild/deps/8080-cosim/host/include -Ibuild/deps/8080-cosim/host/src build/deps/8080-cosim/host/tests/serial_format_test.c build/deps/8080-cosim/host/src/platform_posix.c -o build/serial-format-test
          build/serial-format-test
      - run: make -C build/deps/dac-emulation build/robotron-receive-phase test-robotron-devices test-robotron-bank-bus && build/deps/dac-emulation/build/robotron-receive-phase
      - run: make test
      - run: DAC=build/deps/dac-emulation python -m unittest discover -s tests -p serial_crc_fast_test.py
      - run: python tools/check_wm_runtime.py --host build/deps/8080-cosim/build/jukuhost --rom build/deps/ravi/src/ravi/backends/robotron1715w/rom-w3.bin --out local/wm-w3 --corrupt-read
      - run: python tools/check_wm_runtime.py --host build/deps/8080-cosim/build/jukuhost --rom build/deps/ravi/src/ravi/backends/robotron1715w/rom.bin --rom-profile w2 --out local/wm-w2
      - run: python tools/check_wm_runtime.py --host build/deps/8080-cosim/build/jukuhost --rom build/deps/ravi/src/ravi/backends/robotron1715w/rom-w3.bin --out local/wm-readonly --read-only
      - run: |
          for rate in 9600 41600 62400; do
            python tools/check_w4_runtime.py --host build/deps/8080-cosim/build/jukuhost --rom build/deps/ravi/src/ravi/backends/robotron1715w/rom-w4.bin --out local/w4-$rate --baud $rate
          done
      - run: python tools/package_wm.py --ravi build/deps/ravi --host build/deps/8080-cosim/build/jukuhost --reports local/wm-w3/result.json local/wm-w2/result.json local/wm-readonly/result.json
      - run: make test-banked DAC=build/deps/dac-emulation
      - run: python tools/check_banked_reproducible.py
      - run: |
          for rate in 9600 41600 62400; do
            extra=""
            if [ "$rate" = 41600 ]; then extra="--corrupt-read"; fi
            if [ "$rate" = 62400 ]; then extra="--fragmented --ram-fill 0xaa"; fi
            python tools/check_w4_runtime.py --banked --extended $extra --baud "$rate" --host build/deps/8080-cosim/build/jukuhost --rom build/deps/ravi/src/ravi/backends/robotron1715w/rom-w4.bin --out local/banked-$rate
          done
          python tools/check_w4_runtime.py --banked --read-only --baud 9600 --host build/deps/8080-cosim/build/jukuhost --rom build/deps/ravi/src/ravi/backends/robotron1715w/rom-w4.bin --out local/banked-readonly
          for fault in header payload duplicate foreign missing-bank; do
            python tools/check_w4_runtime.py --banked --fault "$fault" --host build/deps/8080-cosim/build/jukuhost --rom build/deps/ravi/src/ravi/backends/robotron1715w/rom-w4.bin --out local/banked-$fault
          done
      - name: Shared automatic recovery, banked and nonbanked
        run: |
          for rate in 9600 41600 62400; do
            python tools/check_auto_recovery.py --host build/deps/8080-cosim/build/jukuhost --out local/auto-banked-$rate --baud $rate
            python tools/check_auto_recovery.py --host build/deps/8080-cosim/build/jukuhost --out local/auto-nonbanked-$rate --baud $rate --nonbanked
          done
      - run: python tools/package_banked.py --ravi build/deps/ravi --host build/deps/8080-cosim/build/jukuhost --reproducible reports/banked-reproducible.json --reports local/banked-*/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wm-${{ matrix.os }}
          path: |
            local/wm-*/
            out/cpm-plus-1715-wm.zip
            local/banked-*/
            out/cpm-plus-1715-wm-banked.zip
            reports/banked-reproducible.json
